<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mis apuntes · Uniovi Virtual</title>
    <link rel="icon" href="icons/icon48.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1d2330;
        --muted: #5d6676;
        --line: #e1e5eb;
        --accent: #1f5fa8;
        --accent-soft: #e6eef8;
        --new: #1b7a3d;
        --new-soft: #e3f4e8;
        --focus: #2f7de1;
        font: 15px/1.45 system-ui, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15181d;
          --card: #1e2229;
          --text: #e6e9ee;
          --muted: #9aa3b2;
          --line: #2f3540;
          --accent: #7fb0ec;
          --accent-soft: #23324a;
          --new: #7fd49a;
          --new-soft: #1f3a29;
          --focus: #7fb0ec;
        }
      }
      * { box-sizing: border-box; }
      /* Chrome gives extension pages a 75% body font size by default: set it explicitly. */
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
      main { max-width: 980px; margin: 0 auto; padding: 24px 20px 64px; }
      header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
      h1 { font-size: 26px; margin: 0; }
      #summary { color: var(--muted); }
      button, select, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
      .toolbar input[type="search"] { flex: 1 1 280px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
      .toolbar select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
      .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); white-space: nowrap; }
      .btn:hover { border-color: var(--accent); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      @media (prefers-color-scheme: dark) { .btn.primary { color: #10151c; } }
      .btn.small { padding: 4px 10px; font-size: 13px; }
      .notice { color: var(--muted); margin: 8px 0; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
      details > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; gap: 10px; align-items: baseline; }
      details > summary::-webkit-details-marker { display: none; }
      details > summary::before { content: "▸"; color: var(--muted); width: 1em; }
      details[open] > summary::before { content: "▾"; }
      summary .course { font-size: 17px; font-weight: 600; }
      summary .count { color: var(--muted); font-size: 13px; }
      h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 0; padding: 10px 16px 4px; border-top: 1px solid var(--line); }
      ul { list-style: none; margin: 0; padding: 0 0 6px; }
      li.file { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
      li.file:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
      .type { flex: none; width: 82px; text-align: center; font-size: 12px; font-weight: 600; padding: 3px 0; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
      .type.pdf { background: #fbe7e6; color: #b3261e; }
      .type.word { background: #e4ecfa; color: #1d4fa0; }
      .type.powerpoint { background: #fcebe2; color: #b3471b; }
      .type.excel { background: #e3f3e8; color: #1c6b3a; }
      .type.image { background: #f1e7f8; color: #6f3a99; }
      .type.text { background: #ececec; color: #444; }
      @media (prefers-color-scheme: dark) {
        .type.pdf { background: #44201e; color: #f3a59f; }
        .type.word { background: #1e2c47; color: #9dbcf2; }
        .type.powerpoint { background: #45281a; color: #f2b08e; }
        .type.excel { background: #1b3a26; color: #8fd5a6; }
        .type.image { background: #36263f; color: #d3b0ee; }
        .type.text { background: #33363b; color: #cfd2d7; }
      }
      .info { flex: 1; min-width: 0; }
      .title { display: block; max-width: 100%; text-align: left; border: 0; padding: 0; background: none; color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
      button.title:hover { color: var(--accent); text-decoration: underline; }
      .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
      .badge-new { flex: none; font-size: 12px; font-weight: 700; color: var(--new); background: var(--new-soft); padding: 2px 8px; border-radius: 999px; }
      .actions { flex: none; display: flex; gap: 6px; }
      li.skipped .title, li.skipped .type { opacity: 0.55; }
      a.btn { text-decoration: none; color: inherit; }
      #results .hit { display: block; padding: 10px 16px; border-top: 1px solid var(--line); }
      #results .hit:first-of-type { border-top: 0; }
      .hit .where { font-weight: 600; color: var(--accent); }
      .hit .snippet { color: var(--muted); font-size: 14px; margin: 2px 0 6px; overflow-wrap: anywhere; }
      .results-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
      .results-head h2 { font-size: 17px; margin: 0; }
      .empty { text-align: center; padding: 48px 24px; }
      .empty p { font-size: 17px; max-width: 520px; margin: 0 auto 18px; }
      header .add { margin-left: auto; }
      .btn.danger:hover, .btn.danger.armed { border-color: #c62828; color: #c62828; }
      .btn.danger.armed { font-weight: 700; }
      @media (prefers-color-scheme: dark) { .btn.danger:hover, .btn.danger.armed { border-color: #f08a84; color: #f08a84; } }
      #uploadNotes { margin: 0 0 16px; padding: 0; }
      #uploadNotes li { padding: 4px 0; overflow-wrap: anywhere; }
      #uploadNotes li.ok { color: var(--new); }
      #uploadNotes li.ok::before { content: "✓ "; }
      #uploadNotes li.error { color: #c62828; }
      #uploadNotes li.error::before { content: "✕ "; }
      @media (prefers-color-scheme: dark) { #uploadNotes li.error { color: #f08a84; } }
      #dropHint { position: fixed; inset: 12px; z-index: 10; display: flex; align-items: center; justify-content: center; border: 3px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--accent-soft) 88%, transparent); color: var(--accent); font-size: 22px; font-weight: 600; text-align: center; padding: 24px; pointer-events: none; }
      #dropHint[hidden] { display: none; }
      body.viewer { overflow: hidden; }
      body.viewer iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Mis apuntes</h1>
        <span id="summary"></span>
        <button id="addFile" class="btn add" type="button" title="Añade tus propios archivos (por ejemplo, el calendario de exámenes) para que tu IA también los lea">Añadir archivo</button>
        <input id="fileInput" type="file" multiple hidden />
      </header>
      <ul id="uploadNotes" aria-live="polite" hidden></ul>
      <div id="toolbar" class="toolbar" hidden>
        <input id="filter" type="search" placeholder="Escribe para filtrar por nombre o tema" aria-label="Filtrar archivos" autocomplete="off" />
        <button id="searchInside" class="btn primary" type="button">Buscar dentro de los apuntes</button>
        <select id="sort" aria-label="Ordenar"></select>
      </div>
      <section id="results" class="card" hidden></section>
      <p id="noMatch" class="notice" hidden></p>
      <div id="list"></div>
    </main>
    <div id="dropHint" hidden>Suelta aquí tus archivos para añadirlos a Mis apuntes</div>
    <script type="module" src="files.js"></script>
  </body>
</html>
