<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Uniovi Virtual</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --fg: #1d2125; --muted: #5f6b76; --line: #dde3ea; --soft: #f3f6fa;
        --accent: #1559b5; --accent-fg: #ffffff; --ok: #1b7a32; --ok-bg: #e6f4ea; --busy: #8a5a00; --busy-bg: #fff4d6;
        --err: #b3261e; --err-bg: #fde8e7; --off: #5f6b76; --off-bg: #eef1f4;
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1f23; --fg: #e8eaed; --muted: #a3adb8; --line: #343a42; --soft: #262a30;
          --accent: #6ea8ff; --accent-fg: #0b1a33; --ok: #7ad08f; --ok-bg: #17321f; --busy: #f2c35b; --busy-bg: #3a2f12;
          --err: #ff8a80; --err-bg: #3d1a18; --off: #a3adb8; --off-bg: #2a2f35;
        }
      }
      body { width: 340px; margin: 0; padding: 14px; background: var(--bg); color: var(--fg); }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
      header img { width: 28px; height: 28px; }
      h1 { font-size: 17px; margin: 0; }
      .status { border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
      .status .text { font-size: 16px; font-weight: 650; }
      .status .hint { margin-top: 2px; font-size: 13px; }
      .status.ok { background: var(--ok-bg); color: var(--ok); }
      .status.busy { background: var(--busy-bg); color: var(--busy); }
      .status.error { background: var(--err-bg); color: var(--err); }
      .status.off { background: var(--off-bg); color: var(--off); }
      .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px; font-size: 15px; font-weight: 600; cursor: pointer; }
      .switch input { appearance: none; width: 46px; height: 26px; border-radius: 13px; background: var(--line); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .15s; }
      .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
      .switch input:checked { background: var(--accent); }
      .switch input:checked::after { left: 23px; }
      .switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button { font: inherit; cursor: pointer; border-radius: 10px; }
      .primary { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; font-weight: 700; border: 0; background: var(--accent); color: var(--accent-fg); }
      .row { display: flex; gap: 8px; }
      .secondary { flex: 1; padding: 10px 8px; font-weight: 600; border: 1px solid var(--line); background: var(--soft); color: var(--fg); }
      button:disabled { opacity: .55; cursor: default; }
      .sync { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
      .sync #syncText { flex: 1; font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }
      .sync #syncText.error { color: var(--err); }
      .sync button { padding: 6px 10px; border: 1px solid var(--line); background: var(--soft); color: var(--fg); font-size: 13px; flex: none; }
      .update { border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
      .update ol { margin: 6px 0; padding-left: 20px; }
      .update p { margin: 0; color: var(--muted); }
      .update a { color: var(--accent); font-weight: 600; }
      details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 13px; }
      summary { cursor: pointer; color: var(--muted); padding: 4px 0; }
      details .block { margin: 10px 0; }
      details label { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
      details input[type="number"] { width: 4em; }
      details select, details input { font: inherit; }
      details .small { font-size: 12px; color: var(--muted); }
      details .danger { color: var(--err); }
      details button { padding: 6px 10px; border: 1px solid var(--line); background: var(--soft); color: var(--fg); }
      #confirmRotate { margin-top: 6px; padding: 8px; border-radius: 8px; background: var(--err-bg); }
      #confirmRotate .row { margin-top: 6px; }
      #linkBox { width: 100%; box-sizing: border-box; font: 11px ui-monospace, monospace; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); color: var(--fg); }
    </style>
  </head>
  <body>
    <header><img src="icons/icon48.png" alt="" /><h1>Uniovi Virtual</h1></header>
    <div id="update"></div>
    <div id="status" class="status busy" role="status" aria-live="polite"><div class="text">Conectando…</div><div class="hint"></div></div>
    <label class="switch"><span>Conectar con mi IA</span><input type="checkbox" role="switch" id="aiConnection" checked /></label>
    <button id="copy" class="primary">Copiar enlace para tu IA</button>
    <div class="row">
      <button id="files" class="secondary">Mis apuntes</button>
      <button id="howto" class="secondary">Cómo conectarla</button>
    </div>
    <div class="sync">
      <span id="syncText"></span>
      <button id="sync">Sincronizar ahora</button>
    </div>
    <details id="advanced">
      <summary>Opciones avanzadas</summary>
      <div class="block">
        <strong>Tu enlace</strong>
        <input id="linkBox" readonly aria-label="Tu enlace para la IA" />
        <div class="small">Es privado: quien lo tenga puede leer tus apuntes. No lo compartas.</div>
        <div style="margin-top: 6px"><button id="rotate">Cambiar enlace</button></div>
        <div id="confirmRotate" hidden>
          <div class="danger">El enlace antiguo dejará de funcionar y tendrás que pegar el nuevo en tu IA.</div>
          <div class="row"><button id="rotateYes">Sí, cambiar</button><button id="rotateNo">Cancelar</button></div>
        </div>
      </div>
      <div class="block">
        <strong>Sincronización</strong>
        <label>Asignaturas
          <select id="courseScope">
            <option value="inprogress">Solo las de este curso</option>
            <option value="all">Todas (también pasadas)</option>
          </select>
        </label>
        <label><input type="checkbox" id="autoSync" /> Actualizar sola cada <input type="number" id="autoSyncHours" min="1" /> h</label>
        <label><input type="checkbox" id="downloadFiles" /> Guardar archivos de hasta <input type="number" id="maxFileMB" min="1" /> MB</label>
        <label>Respuestas del foro de los últimos <input type="number" id="replyWindowDays" min="0" /> días</label>
        <label><input type="checkbox" id="notify" /> Avisarme de anuncios nuevos</label>
        <label><input type="checkbox" id="syncGrades" /> Dejar que mi IA vea mis notas</label>
      </div>
      <div class="block small" id="usage">Espacio usado: …</div>
      <div class="block small" id="diag"></div>
    </details>
    <script type="module" src="popup.js"></script>
  </body>
</html>
