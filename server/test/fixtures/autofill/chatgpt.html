<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ChatGPT plugins (fixture)</title></head>
<body>
<!-- Imitates chatgpt.com/plugins (2026): an icon-only "+" button (aria-label) opens a menu with
     "Add custom MCP server"; the dialog has a hidden icon file input, Name, Description, MCP Server URL, a native
     Authentication select (OAuth by default) and a trust box. -->
<div id="app"></div>
<script src="common.js"></script>
<script>
later(1200, () => {
  app.innerHTML = `
    <nav><a href="#">Chats</a><a href="#">Plugins</a><a href="#c/1" id="pastChat">Add custom MCP</a></nav>
    <h1>Plugins</h1>
    <input type="search" placeholder="Search plugins">
    <button id="plus" aria-label="Add">+</button>
    <div id="menu" role="menu" hidden><div role="menuitem" tabindex="0" id="mcpItem">Add custom MCP server</div></div>`;
  // A past chat in the sidebar whose title matches the step text (seen live): never opened.
  pastChat.onclick = (e) => { e.preventDefault(); window.__decoyClicks = (window.__decoyClicks || 0) + 1; };
  // Like Radix on the real site: the menu opens on pointerdown; a bare el.click() does nothing.
  plus.onpointerdown = () => later(200, () => (menu.hidden = false));
  mcpItem.onclick = () => {
    menu.hidden = true;
    const d = document.createElement("div");
    d.setAttribute("role", "dialog");
    d.innerHTML = `
      <h2>New connector</h2>
      <label>Name<input name="name" data-field="name"></label>
      <label>Description <span>(optional)</span><textarea name="description" data-field="description"></textarea></label>
      <label>MCP Server URL<input name="server_url" data-field="url"></label>
      <label>Icon (optional) <input type="file" accept="image/png" id="icon" hidden></label>
      <label>Authentication <select id="auth"><option>OAuth</option><option>No authentication</option><option>OAuth or no authentication</option></select></label>
      <label><input type="checkbox"> I understand and want to continue</label>
      <button data-confirm disabled>Create</button>`;
    document.body.append(d);
    bindForm(d);
    // Like the real form: OAuth by default, which our link cannot use.
    window.__state.auth = auth.value;
    auth.onchange = () => (window.__state.auth = auth.value);
    icon.onchange = () => (window.__state.icon = icon.files[0] ? `${icon.files[0].type} ${icon.files[0].size}` : "");
  };
});
</script>
</body></html>
